name: Gemini Code Review
on:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install 'google-genai>=1.0,<2.0'

      - name: Run Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff -U10 "$BASE_SHA" "$HEAD_SHA" \
            -- ':(exclude)package-lock.json' ':(exclude)yarn.lock' \
               ':(exclude)pnpm-lock.yaml' ':(exclude)*.lock' \
            > /tmp/diff.txt

          python - <<'PYEOF'
          import os, sys
          from google import genai
          from google.genai import types

          with open("/tmp/diff.txt") as f:
              diff = f.read()

          if not diff.strip():
              print("No diff found, skipping review.")
              with open("/tmp/review.txt", "w") as f:
                  f.write("No changes to review.")
              sys.exit(0)

          max_chars = 100000
          original_len = len(diff)
          truncated = False
          if original_len > max_chars:
              diff = diff[:max_chars]
              truncated = True
              print(f"Diff truncated from {original_len} to {max_chars} characters.")

          prompt = """Review this PR's changes. Respond in Japanese.

          Use this EXACT format:

          ## Review Summary
          - Critical: <count>
          - Major: <count>
          - Minor: <count>

          ## Findings

          ### [CRITICAL] <title>
          - File: <path>
          - Line: <number or range>
          - Issue: <description>
          - Fix: <suggested fix>

          ### [MAJOR] <title>
          (same format as above)

          ### [MINOR] <title>
          (same format as above)

          Categories:
          - CRITICAL: Bugs, crashes, security vulnerabilities, data loss
          - MAJOR: Logic errors, missing error handling, test gaps
          - MINOR: Style issues, naming, documentation

          Error Concealment Check (flag as MAJOR):
          - Empty or console-only catch blocks that swallow errors silently
          - try-catch where finally/subsequent code runs regardless of failure (e.g., dialog closes on both success and error)
          - Guard flags (if isLoading/isPreparing return) that mask why a function is called multiple times
          - Default/fallback values that silently replace failed computations
          - Workflow "continue on error" settings that bypass error notification pipelines

          If no issues found:
          ## Review Summary
          - Critical: 0
          - Major: 0
          - Minor: 0

          No issues found."""

          # 混雑 (503 など) は一時的なことが多いので、待って送り直す。
          # それでも失敗したら「レビュー済み」に見えないようにして、ジョブも失敗にする
          # (以前は失敗してもジョブが成功し、マージガードが指摘 0 件のレビューとして通していた)
          import time
          from google.genai import errors

          RETRY_CODES = {429, 500, 502, 503, 504}
          WAITS = [20, 40, 80]  # 秒。最大 3 回送り直す

          def review():
              client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
              for attempt in range(len(WAITS) + 1):
                  try:
                      response = client.models.generate_content(
                          model="gemini-2.5-flash",
                          contents=f"## PR Diff:\n```\n{diff}\n```\n\n{prompt}",
                          config=types.GenerateContentConfig(
                              system_instruction="You are a code review assistant reviewing pull request changes.",
                              temperature=0.0,
                          ),
                      )
                  except errors.APIError as e:
                      if e.code in RETRY_CODES and attempt < len(WAITS):
                          print(f"Gemini API {e.code}: {WAITS[attempt]} 秒待って送り直す ({attempt + 1}/{len(WAITS)})",
                                file=sys.stderr, flush=True)
                          time.sleep(WAITS[attempt])
                          continue
                      raise
                  if not response.text:
                      raise RuntimeError("Gemini の返事が空でした")
                  return response.text

          failed = False
          try:
              review_text = review()
          except Exception as e:
              failed = True
              review_text = f"Gemini API でレビューを実行できませんでした。再実行してください。\n\n```\n{e}\n```"
              print(f"Error calling Gemini API: {e}", file=sys.stderr)

          if truncated:
              review_text += "\n\n> **Note**: Diff was truncated due to size. Review may be incomplete."

          with open("/tmp/review.txt", "w") as f:
              f.write(review_text)
          if failed:
              open("/tmp/review_failed", "w").close()
          print(review_text)
          PYEOF

          # ヘッダーを付与してコメント本文を作成。失敗したときは別の見出しにして、
          # マージガード (「Code Review by Gemini」を探す) にレビュー済みと読まれないようにする
          if [ -f /tmp/review_failed ]; then
            header="# Gemini Review Failed"
          else
            header="# Code Review by Gemini"
          fi
          {
            echo "$header"
            echo ""
            cat /tmp/review.txt
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          if [ -f /tmp/review_failed ]; then
            echo "::error::Gemini レビューを実行できませんでした"
            exit 1
          fi
