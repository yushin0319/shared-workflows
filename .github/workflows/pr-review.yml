name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # このリポジトリ自身の PR は、PR 側の gemini-review.yml で動かす (変更をその PR で試せるように)
    uses: ./.github/workflows/gemini-review.yml
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
